<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Attendance System - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
<div class="login-container">
<div class="login-left">
<div class="cloud-icon">☁️</div>
<h1>Cloud Attendance</h1>
<p>Smart and simple student attendance management system for colleges and schools.</p>
<div class="login-features">
<div>✓ Manage Students</div><div>✓ Mark Attendance</div><div>✓ View Reports</div><div>✓ Cloud Based Management</div>
</div>
</div>
<div class="login-card">
<h2>Welcome Back</h2><p class="login-subtitle">Login to your account</p>
<form id="loginForm">
<label>Username</label>
<input type="text" id="username" placeholder="Enter username" required>
<label>Password</label>
<input type="password" id="password" placeholder="Enter password" required>
<button type="submit" class="primary-btn">Login</button>
<p id="loginMessage"></p>
</form>
<div class="demo-login"><strong>Demo Login</strong><p>Username: admin</p><p>Password: admin123</p></div>
</div>
</div>
<script src="js/login.js"></script>
</body>
</html>
