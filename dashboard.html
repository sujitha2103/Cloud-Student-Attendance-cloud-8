<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Attendance System</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="main-container">
<aside class="sidebar"><div class="logo">☁️ Cloud Attendance</div>
<a href="dashboard.html" class="nav-link active">🏠 Dashboard</a>
<a href="students.html" class="nav-link">👨‍🎓 Students</a>
<a href="attendance.html" class="nav-link">✅ Attendance</a>
<a href="reports.html" class="nav-link">📊 Reports</a>
<a href="index.html" class="nav-link logout">🚪 Logout</a></aside>
<main class="main-content">
<div class="topbar"><div><h1>Dashboard</h1><p>Student Attendance Management System</p></div><div class="user">👤 Admin</div></div>
<div class="card-grid">
<div class="stat-card"><div class="stat-icon">👨‍🎓</div><h3>Total Students</h3><h2 id="totalStudents">0</h2></div>
<div class="stat-card"><div class="stat-icon">✅</div><h3>Present Today</h3><h2 id="presentStudents">0</h2></div>
<div class="stat-card"><div class="stat-icon">❌</div><h3>Absent Today</h3><h2 id="absentStudents">0</h2></div>
<div class="stat-card"><div class="stat-icon">📊</div><h3>Attendance Rate</h3><h2 id="attendanceRate">0%</h2></div>
</div>
<div class="table-container"><h2>Recent Students</h2><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Year</th></tr></thead><tbody id="recentStudents"></tbody></table></div>
</main></div>
<script src="js/dashboard.js"></script></body></html>
